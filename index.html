        const OFFICIAL_RECITATION_DATES = [

        const WEEKDAY_ABBR = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

            return normalized === 'وسطى' || normalized === 'وسطي';
        };

        const getDayOfWeek = (dateStr) => new Date(`${dateStr}T00:00:00`).getDay();
        const formatDateWithWeekday = (dateStr) => {
            if (!dateStr) return "-";
            return `${dateStr} (${WEEKDAY_ABBR[getDayOfWeek(dateStr)]})`;
        };
        const isOfficialRecitationDate = (dateStr) => OFFICIAL_RECITATION_DATES.includes(dateStr);
        const isGoalDay = (dateStr, groupName) => {
            if (!isOfficialRecitationDate(dateStr)) return false;
            if (dateStr === FIRST_RECITATION_DATE) return !isWustaGroup(groupName);
            const day = getDayOfWeek(dateStr);
            return day === 3 || day === 6; // Wednesday or Saturday
        };

        const calculateExpectedDaysForGroup = (groupName, start, end) => {
            return OFFICIAL_RECITATION_DATES.filter(date => date >= start && date <= end).length;
        };
        const isSardDay = (dateStr) => {
            return false;
        };

        const normalizeArabicDigits = (value) => {
            if (value === null || value === undefined) return '';

            return String(value)
                .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
                .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));
        };

        const getPageSetFromRaw = (raw) => {
            if (typeof raw !== 'string') return null;

            const normalized = normalizeArabicDigits(raw)
                .replace(/[–—−]/g, '-')
                .replace(/[،,]/g, '+')
                .replace(/\s+/g, '');

            if (!normalized) return null;

            const pages = new Set();
            const segments = normalized.split('+').filter(Boolean);

            segments.forEach(segment => {
                const numbers = (segment.match(/\d+/g) || [])
                    .map(Number)
                    .filter(n => Number.isFinite(n) && n > 0);

                if (numbers.length === 0) return;

                if (segment.includes('-') && numbers.length >= 2) {
                    const start = Math.min(numbers[0], numbers[1]);
                    const end = Math.max(numbers[0], numbers[1]);

                    for (let page = start; page <= end; page += 1) {
                        pages.add(page);
                    }
                    return;
                }

                numbers.forEach(page => pages.add(page));
            });

            return pages.size > 0 ? pages : null;
        };

        const formatPageSet = (pageSet) => {
            if (!pageSet || pageSet.size === 0) return '---';

            const sorted = [...pageSet].sort((a, b) => a - b);
            const ranges = [];

            let start = sorted[0];
            let prev = sorted[0];

            for (let i = 1; i < sorted.length; i += 1) {
                const current = sorted[i];
                if (current === prev + 1) {
                    prev = current;
                    continue;
                }

                ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
                start = current;
                prev = current;
            }

            ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
            return ranges.join(' + ');
        };

        const getRangeEdgesFromRaw = (raw) => {
            const pageSet = getPageSetFromRaw(raw);
            if (!pageSet || pageSet.size === 0) return null;

            const numbers = [...pageSet];

            return {
                start: Math.min(...numbers),
                end: Math.max(...numbers)
            };
        };

        const getPageSetFromSessionItem = (sessionItem) => {
            if (!sessionItem) return null;

            // Raw text can encode disjoint ranges (e.g., 502-531+402-431+350-364).
            // Prefer it to avoid stale start/end values collapsing the set.
            const rawPageSet = getPageSetFromRaw(sessionItem.raw);
            if (rawPageSet && rawPageSet.size > 0) {
                return rawPageSet;
            }

            const start = Number(sessionItem.start);
            const end = Number(sessionItem.end);
            if (Number.isFinite(start) && Number.isFinite(end) && start > 0 && end > 0) {
                const pages = new Set();
                const low = Math.min(start, end);
                const high = Math.max(start, end);
                for (let page = low; page <= high; page += 1) {
                    pages.add(page);
                }
                return pages;
            }

            return getPageSetFromRaw(sessionItem.raw);
        };

        const getNumericPages = (sessionItem) => {
            if (!sessionItem) return 0;

            const pageSet = getPageSetFromSessionItem(sessionItem);
            if (pageSet && pageSet.size > 0) {
                return pageSet.size;
            }

            const pagesValue = sessionItem.pages;
            if (typeof pagesValue === 'number' && Number.isFinite(pagesValue)) {
                return pagesValue;
            }

            if (typeof pagesValue === 'string') {
                const parsed = Number(normalizeArabicDigits(pagesValue).trim());
                if (Number.isFinite(parsed)) return parsed;
            }

            return 0;
        };

        const formatPagesCount = (value) => {
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return '0';
            return Number.isInteger(numeric) ? `${numeric}` : numeric.toFixed(1);
        };

        const summarizeRaw = (sessions = [], category = 'review') => {
            const activeItems = (sessions || []).map(s => s[category]).filter(Boolean);
            if (activeItems.length === 0) return '---';

            const mergedSet = activeItems.reduce((setAcc, item) => {
                const itemSet = getPageSetFromSessionItem(item);
                if (itemSet && itemSet.size > 0) {
                    itemSet.forEach(page => setAcc.add(page));
                }
                return setAcc;
            }, new Set());

            if (mergedSet.size > 0) {
                return formatPageSet(mergedSet);
            }

            const uniqueRaws = [...new Set(activeItems.map(item => (item.raw || '').trim()).filter(Boolean))];
            return uniqueRaws.length > 0 ? uniqueRaws.join(' ، ') : '---';
        };

        const getPageBoundsFromSessionItem = (sessionItem) => {
            const pageSet = getPageSetFromSessionItem(sessionItem);
            if (!pageSet || pageSet.size === 0) return null;

            const numbers = [...pageSet];
            return {
                start: Math.min(...numbers),
                end: Math.max(...numbers)
            };
        };

        const getBoundsFromPageSet = (pageSet) => {
            if (!pageSet || pageSet.size === 0) return null;

            let minPage = Infinity;
            let maxPage = -Infinity;

            pageSet.forEach(page => {
                if (page < minPage) minPage = page;
                if (page > maxPage) maxPage = page;
            });

            return { start: minPage, end: maxPage };
        };

        const mergeBounds = (currentBounds, incomingBounds) => {
            if (!incomingBounds) return currentBounds;
            if (!currentBounds) return { ...incomingBounds };

            return {
                start: Math.min(currentBounds.start, incomingBounds.start),
                end: Math.max(currentBounds.end, incomingBounds.end)
            };
        };

        const formatBounds = (bounds) => {
            if (!bounds) return '---';
            return bounds.start === bounds.end ? `${bounds.start}` : `${bounds.start}-${bounds.end}`;
        };

        const getSessionSplitStatsByIndex = (history = []) => {
            const ordered = history
                .map((session, idx) => ({ session, idx }))
                .sort((a, b) => {
                    const dateA = a.session?.date || '';
                    const dateB = b.session?.date || '';
                    if (dateA === dateB) return a.idx - b.idx;
                    return dateA.localeCompare(dateB);
                });

            const previouslyRecitedAsJadid = new Set();
            const stats = {};

            ordered.forEach(({ session, idx }) => {
                let jadidPages = 0;
                let sardPages = 0;
                let jadidBounds = null;
                let sardBounds = null;
                let jadidRaw = '---';
                let sardRaw = '---';
                let jadidPageSet = new Set();
                let sardPageSet = new Set();

                const newPageSet = getPageSetFromSessionItem(session?.new);
                if (newPageSet && newPageSet.size > 0) {

                    newPageSet.forEach(page => {
                        if (isSardDay(session?.date) && previouslyRecitedAsJadid.has(page)) {
                            sardPageSet.add(page);
                        } else {
                            jadidPageSet.add(page);
                        }
                    });

                    jadidPages = jadidPageSet.size;
                    sardPages = sardPageSet.size;
                    jadidBounds = getBoundsFromPageSet(jadidPageSet);
                    sardBounds = getBoundsFromPageSet(sardPageSet);
                    jadidRaw = formatPageSet(jadidPageSet);
                    sardRaw = formatPageSet(sardPageSet);

                    jadidPageSet.forEach(page => previouslyRecitedAsJadid.add(page));
                } else {
                    const fallbackNewPages = getNumericPages(session?.new);
                    const fallbackPageSet = getPageSetFromSessionItem(session?.new) || new Set();
                    if (isSardDay(session?.date)) {
                        sardPages = fallbackNewPages;
                        sardRaw = (session?.new?.raw || '').trim() || '---';
                        sardPageSet = fallbackPageSet;
                    } else {
                        jadidPages = fallbackNewPages;
                        jadidRaw = (session?.new?.raw || '').trim() || '---';
                        jadidPageSet = fallbackPageSet;
                    }
                }

                stats[idx] = { jadidPages, sardPages, jadidBounds, sardBounds, jadidRaw, sardRaw, jadidPageSet, sardPageSet };
            });

            return stats;
        };

        const calculateTotalNewPagesInRange = (filteredEntries = [], splitStats = {}) => {
            const pageSet = new Set();
            let numericFallback = 0;

            filteredEntries.forEach(({ session, idx }) => {
                const pSet = splitStats[idx]?.jadidPageSet || getPageSetFromSessionItem(session?.new);
                if (pSet && pSet.size > 0) {
                    pSet.forEach(p => pageSet.add(p));
                } else {
                    const num = splitStats[idx]?.jadidPages || 0;
                    if (num > 0) numericFallback += num;
                }
            });

            return pageSet.size + numericFallback;
        };

        const calculateTotalSardPagesInRange = (sardEntries = [], splitStats = {}) => {
            const pageSet = new Set();
            let numericFallback = 0;

            sardEntries.forEach(({ session, idx }) => {
                const pSet = splitStats[idx]?.sardPageSet || getPageSetFromSessionItem(session?.new);
                if (pSet && pSet.size > 0) {
                    pSet.forEach(p => pageSet.add(p));
                } else {
                    const num = splitStats[idx]?.sardPages || 0;
                    if (num > 0) numericFallback += num;
                }
            });

            return pageSet.size + numericFallback;
        };

        const isAttendancePresent = (attendance) => {
            const status = (attendance?.status || '')
                .normalize('NFKC')
                .replace(/[\u064B-\u065F\u0670]/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            // Any explicit absence wording should be counted as absent, regardless of present flag.
            if (status.includes('لم يحضر') || status.includes('غاب') || status.includes('غياب')) return false;
            return Boolean(attendance?.present);
        };

        const GRADE_VALUES = {
            "مقبول": 25,
            "جيد": 50,
            "جيد جدًا": 75,
            "ممتاز": 100
        };

        const VALUE_TO_GRADE = {
            25: "مقبول",
            50: "جيد",
            75: "جيد جدًا",
            100: "ممتاز"
        };

        const getGradePillClass = (grade) => {
            if (!grade) return "bg-slate-50 text-slate-600 border border-slate-100";
            const trimmed = grade.trim();
            switch (trimmed) {
                case "ممتاز":
                    return "bg-emerald-50 text-emerald-700 border border-emerald-100/80";
                case "جيد جدًا":
                    return "bg-blue-50 text-blue-700 border border-blue-100/80";
                case "جيد":
                    return "bg-sky-50 text-sky-700 border border-sky-100/80";
                case "مقبول":
                    return "bg-amber-50 text-amber-700 border border-amber-100/80";
                default:
                    return "bg-slate-50 text-slate-600 border border-slate-100";
            }
        };

        // Mathematical rounding logic for single average grades
        const calculateMeanGrade = (sessions, category) => {
            const activeGrades = sessions
                .map(s => s[category]?.grade)
                .filter(Boolean);

            if (activeGrades.length === 0) return null;

            let sum = 0;
            let count = 0;

            activeGrades.forEach(gradeStr => {
                const trimmed = gradeStr.trim();
                if (GRADE_VALUES[trimmed] !== undefined) {
                    sum += GRADE_VALUES[trimmed];
                    count++;
                }
            });

            if (count === 0) return null;

            const mean = sum / count;

            let roundedValue = 100;
            if (mean < 37.5) {
                roundedValue = 25;
            } else if (mean < 62.5) {
                roundedValue = 50;
            } else if (mean < 87.5) {
                roundedValue = 75;
            } else {
                roundedValue = 100;
            }

            return VALUE_TO_GRADE[roundedValue];
        };

        const calculateAverageGradeValue = (sessions, category) => {
            const activeItems = sessions.map(s => s[category]).filter(Boolean);
            if (activeItems.length === 0) return 0;

            let sum = 0;
            let count = 0;

            activeItems.forEach(item => {
                const gradeStr = (item.grade || '').trim();
                if (!gradeStr) {
                    // Confirmed rule: missing grade is treated as 50%.
                    sum += 50;
                    count++;
                    return;
                }

                if (GRADE_VALUES[gradeStr] !== undefined) {
                    sum += GRADE_VALUES[gradeStr];
                    count++;
                } else {
                    // Unknown grade text also defaults to 50% to keep scoring deterministic.
                    sum += 50;
                    count++;
                }
            });

            if (count === 0) return 0;
            return sum / count;
        };

        const initialData = {
            "generatedAt": null,
            "version": 1,
            "settings": {
                "ShowPointsForStudent": false
            },
            "students": []
        };

        const isPointsEnabledForStudent = (settings) => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('previewPoints') === 'true' || urlParams.get('showPoints') === 'true') {
                    return true;
                }
            } catch (e) {}

            if (!settings) return false;
            const val = settings.ShowPointsForStudent !== undefined ? settings.ShowPointsForStudent :
                        settings.showPointsForStudent !== undefined ? settings.showPointsForStudent :
                        settings.show_points_for_student !== undefined ? settings.show_points_for_student :
                        settings.showPoints;
            if (typeof val === 'boolean') return val;
            if (typeof val === 'string') {
                const lower = val.trim().toLowerCase();
                return lower === 'true' || lower === '1' || lower === 'yes';
            }
            if (typeof val === 'number') return val === 1;
            return false;
        };


        // ==========================================
        // CUMULATIVE PROGRESS CHART COMPONENT
        // ==========================================
        const CumulativeProgressChart = ({
            filteredEntries = [],
            sessionSplitStats = {},
            targetPages = 0,
            getReviewPages,
            title = "مخطط التراكمي للإنجاز (الصفحات عبر الجلسات)"
        }) => {
            const [hoveredIndex, setHoveredIndex] = useState(null);

            const { points, maxVal } = useMemo(() => {
                if (!filteredEntries || filteredEntries.length === 0) {
                    return { points: [], maxVal: 10 };
                }

                // Sort filteredEntries chronologically by session date
                const sorted = [...filteredEntries].sort((a, b) => {
                    const dateA = a.session?.date || '';
                    const dateB = b.session?.date || '';
                    return dateA.localeCompare(dateB);
                });

                let cumJadid = 0;
                let cumReview = 0;

                const pts = sorted.map(({ session, idx }) => {
                    const jadid = sessionSplitStats?.[idx]?.jadidPages || 0;
                    const review = typeof getReviewPages === 'function' ? getReviewPages(session) || 0 : 0;

                    cumJadid += jadid;
                    cumReview += review;

                    return {
                        date: session?.date || '',
                        jadid,
                        review,
                        cumJadid: Number(cumJadid.toFixed(1)),
                        cumReview: Number(cumReview.toFixed(1))
                    };
                });

                const allCumValues = pts.flatMap(p => [p.cumJadid, p.cumReview]);
                const maxCum = Math.max(0, ...allCumValues);
                const target = Math.max(0, targetPages || 0);
                const peak = Math.max(maxCum, target);
                const scaledMax = peak > 0 ? peak * 1.15 : 10;

                return { points: pts, maxVal: scaledMax };
            }, [filteredEntries, sessionSplitStats, targetPages, getReviewPages]);

            // Chart layout dimensions
            const svgWidth = 750;
            const svgHeight = 340;
            const paddingLeft = 55;
            const paddingRight = 25;
            const paddingTop = 25;
            const paddingBottom = 65;

            const plotWidth = svgWidth - paddingLeft - paddingRight;
            const plotHeight = svgHeight - paddingTop - paddingBottom;
            const yMax = paddingTop + plotHeight;

            // Compute coordinates
            const mappedPoints = useMemo(() => {
                if (points.length === 0) return [];
                const n = points.length;

                return points.map((pt, i) => {
                    const x = n === 1
                        ? paddingLeft + plotWidth / 2
                        : paddingLeft + (i / (n - 1)) * plotWidth;

                    const yJadid = yMax - (pt.cumJadid / maxVal) * plotHeight;
                    const yReview = yMax - (pt.cumReview / maxVal) * plotHeight;

                    return {
                        ...pt,
                        x,
                        yJadid,
                        yReview
                    };
                });
            }, [points, maxVal, plotWidth, plotHeight, yMax, paddingLeft]);

            // SVG Path strings
            const { jadidLineD, jadidAreaD, reviewLineD } = useMemo(() => {
                if (mappedPoints.length === 0) {
                    return { jadidLineD: '', jadidAreaD: '', reviewLineD: '' };
                }

                const jadidPts = mappedPoints.map(p => `${p.x.toFixed(1)},${p.yJadid.toFixed(1)}`);
                const reviewPts = mappedPoints.map(p => `${p.x.toFixed(1)},${p.yReview.toFixed(1)}`);

                const jLine = `M ${jadidPts.join(' L ')}`;
                const rLine = `M ${reviewPts.join(' L ')}`;

                const firstX = mappedPoints[0].x.toFixed(1);
                const lastX = mappedPoints[mappedPoints.length - 1].x.toFixed(1);
                const jArea = `M ${firstX},${yMax} L ${jadidPts.join(' L ')} L ${lastX},${yMax} Z`;

                return {
                    jadidLineD: jLine,
                    jadidAreaD: jArea,
                    reviewLineD: rLine
                };
            }, [mappedPoints, yMax]);

            // Y Ticks (6 horizontal grid lines)
            const yTicks = useMemo(() => {
                const ticks = [];
                const count = 5;
                for (let i = 0; i <= count; i++) {
                    const val = (maxVal / count) * i;
                    const y = yMax - (val / maxVal) * plotHeight;
                    ticks.push({ val, y });
                }
                return ticks;
            }, [maxVal, plotHeight, yMax]);

            // X label decimation (show max ~12 labels)
            const xLabelStep = useMemo(() => {
                return Math.max(1, Math.ceil(mappedPoints.length / 12));
            }, [mappedPoints.length]);

            // Target line Y position
            const targetY = targetPages > 0 ? yMax - (targetPages / maxVal) * plotHeight : null;

            const hoveredPoint = hoveredIndex !== null && mappedPoints[hoveredIndex] ? mappedPoints[hoveredIndex] : null;

            const formatInc = (val) => {
                if (!val) return '0';
                return val % 1 === 0 ? String(val) : val.toFixed(1);
            };

            return (
                <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    {/* Header with Title & Legend */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3" dir="rtl">
                        <h3 className="text-sm font-black text-slate-800 flex items-center gap-2">
                            <TrendingUp size={18} className="text-indigo-600" />
                            <span>{title}</span>
                        </h3>

                        {/* Legend */}
                        <div className="flex flex-wrap items-center gap-4 text-xs font-bold text-slate-600">
                            <div className="flex items-center gap-1.5">
                                <span className="w-3.5 h-1 bg-indigo-600 rounded-full"></span>
                                <span>الحفظ الجديد</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                                <span className="w-3.5 h-1 bg-sky-500 rounded-full"></span>
                                <span>المراجعة</span>
                            </div>

                            {targetPages > 0 && (
                                <div className="flex items-center gap-1.5">
                                    <span className="w-3.5 h-0.5 border-t-2 border-dashed border-amber-500"></span>
                                    <span className="text-amber-600">الهدف ({targetPages})</span>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Chart Container (LTR direction) */}
                    <div className="w-full relative overflow-hidden" style={{ direction: 'ltr' }}>
                        {mappedPoints.length === 0 ? (
                            <div className="h-44 flex items-center justify-center text-slate-400 text-xs font-medium" dir="rtl">
                                لا توجد بيانات تسميع مسجلة للعرض في هذا النطاق الزمني.
                            </div>
                        ) : (
                            <svg
                                viewBox={`0 0 ${svgWidth} ${svgHeight}`}
                                className="w-full h-auto"
                                style={{ maxHeight: '340px' }}
                            >
                                <defs>
                                    <linearGradient id="jadidGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#4F46E5" stopOpacity="0.25" />
                                        <stop offset="100%" stopColor="#4F46E5" stopOpacity="0.0" />
                                    </linearGradient>
                                </defs>

                                {/* Y-axis Grid Lines & Labels */}
                                {yTicks.map((tick, i) => (
                                    <g key={i}>
                                        <line
                                            x1={paddingLeft}
                                            y1={tick.y}
                                            x2={svgWidth - paddingRight}
                                            y2={tick.y}
                                            stroke="#E2E8F0"
                                            strokeDasharray="4 4"
                                            strokeWidth="1"
                                        />
                                        <text
                                            x={paddingLeft - 8}
                                            y={tick.y + 3.5}
                                            textAnchor="end"
                                            fill="#64748B"
                                            style={{ fontSize: '10px', fontWeight: '500' }}
                                        >
                                            {tick.val.toFixed(1)}
                                        </text>
                                    </g>
                                ))}

                                {/* Rotated Y-axis Label */}
                                <text
                                    x="18"
                                    y={paddingTop + plotHeight / 2}
                                    transform={`rotate(-90 18 ${paddingTop + plotHeight / 2})`}
                                    textAnchor="middle"
                                    fill="#64748B"
                                    style={{ fontSize: '10.5px', fontWeight: 'bold' }}
                                >
                                    صفحات (تراكمي)
                                </text>

                                {/* Target Line */}
                                {targetPages > 0 && targetY !== null && (
                                    <g>
                                        <line
                                            x1={paddingLeft}
                                            y1={targetY}
                                            x2={svgWidth - paddingRight}
                                            y2={targetY}
                                            stroke="#F59E0B"
                                            strokeWidth="1.8"
                                            strokeDasharray="6 4"
                                        />
                                    </g>
                                )}

                                {/* Subtle Area Fill under New Memorization */}
                                {jadidAreaD && (
                                    <path d={jadidAreaD} fill="url(#jadidGradient)" />
                                )}

                                {/* Series Lines */}
                                {/* Review Line (2px, sky blue) */}
                                {reviewLineD && (
                                    <path
                                        d={reviewLineD}
                                        fill="none"
                                        stroke="#0EA5E9"
                                        strokeWidth="2"
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                    />
                                )}



                                {/* New Memorization Line (Thickest: 2.5px, indigo/blue) */}
                                {jadidLineD && (
                                    <path
                                        d={jadidLineD}
                                        fill="none"
                                        stroke="#4F46E5"
                                        strokeWidth="2.5"
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                    />
                                )}

                                {/* Dots on Data Points (only rendered if cumulative value > 0) */}
                                {mappedPoints.map((pt, i) => (
                                    <g key={i}>
                                        {pt.cumReview > 0 && (
                                            <circle
                                                cx={pt.x}
                                                cy={pt.yReview}
                                                r="3"
                                                fill="#0EA5E9"
                                                stroke="#FFFFFF"
                                                strokeWidth="1.5"
                                            />
                                        )}

                                        {pt.cumJadid > 0 && (
                                            <circle
                                                cx={pt.x}
                                                cy={pt.yJadid}
                                                r="3.5"
                                                fill="#4F46E5"
                                                stroke="#FFFFFF"
                                                strokeWidth="1.5"
                                            />
                                        )}
                                    </g>
                                ))}

                                {/* X-axis Date Labels (Rotated -40°) */}
                                {mappedPoints.map((pt, i) => {
                                    const showLabel = i % xLabelStep === 0 || i === mappedPoints.length - 1;
                                    if (!showLabel) return null;
                                    const labelY = yMax + 18;
                                    return (
                                        <text
                                            key={i}
                                            x={pt.x}
                                            y={labelY}
                                            transform={`rotate(-40 ${pt.x} ${labelY})`}
                                            textAnchor="end"
                                            fill="#64748B"
                                            style={{ fontSize: '9.5px', fontWeight: '600' }}
                                        >
                                            {pt.date}
                                        </text>
                                    );
                                })}

                                {/* Invisible Hover Overlay Rectangles */}
                                {mappedPoints.map((pt, i) => {
                                    const sliceWidth = mappedPoints.length > 1
                                        ? plotWidth / (mappedPoints.length - 1)
                                        : plotWidth;
                                    return (
                                        <rect
                                            key={i}
                                            x={pt.x - sliceWidth / 2}
                                            y={paddingTop}
                                            width={sliceWidth}
                                            height={plotHeight + 35}
                                            fill="transparent"
                                            className="cursor-pointer"
                                            onMouseEnter={() => setHoveredIndex(i)}
                                            onMouseLeave={() => setHoveredIndex(null)}
                                        />
                                    );
                                })}

                                {/* Hover Crosshair & Dark Tooltip Box */}
                                {hoveredPoint && (() => {
                                    const tooltipWidth = 175;
                                    const tooltipHeight = 78;
                                    const boxX = hoveredPoint.x > svgWidth - 195
                                        ? hoveredPoint.x - tooltipWidth - 12
                                        : hoveredPoint.x + 12;
                                    const boxY = paddingTop + 10;

                                    return (
                                        <g pointerEvents="none">
                                            {/* Vertical Crosshair Line */}
                                            <line
                                                x1={hoveredPoint.x}
                                                y1={paddingTop}
                                                x2={hoveredPoint.x}
                                                y2={yMax}
                                                stroke="#64748B"
                                                strokeWidth="1"
                                                strokeDasharray="3 3"
                                            />

                                            {/* Highlight Circles on Hovered Points */}
                                            {hoveredPoint.cumJadid > 0 && (
                                                <circle cx={hoveredPoint.x} cy={hoveredPoint.yJadid} r="6" fill="none" stroke="#4F46E5" strokeWidth="2" />
                                            )}
                                            {hoveredPoint.cumReview > 0 && (
                                                <circle cx={hoveredPoint.x} cy={hoveredPoint.yReview} r="5" fill="none" stroke="#0EA5E9" strokeWidth="2" />
                                            )}


                                            {/* Dark Tooltip Box */}
                                            <rect
                                                x={boxX}
                                                y={boxY}
                                                width={tooltipWidth}
                                                height={tooltipHeight}
                                                rx="10"
                                                fill="#0F172A"
                                                opacity="0.95"
                                            />

                                            {/* Tooltip Content Header */}
                                            <text x={boxX + tooltipWidth - 12} y={boxY + 20} textAnchor="end" fill="#F8FAFC" style={{ fontSize: '11px', fontWeight: 'bold' }}>
                                                {hoveredPoint.date}
                                            </text>

                                            <line x1={boxX + 10} y1={boxY + 27} x2={boxX + tooltipWidth - 10} y2={boxY + 27} stroke="#334155" strokeWidth="1" />

                                            {/* New Memorization Line */}
                                            <text x={boxX + tooltipWidth - 12} y={boxY + 44} textAnchor="end" fill="#818CF8" style={{ fontSize: '10.5px', fontWeight: '600' }}>
                                                جديد: {hoveredPoint.cumJadid.toFixed(1)} ص (+{formatInc(hoveredPoint.jadid)})
                                            </text>

                                            {/* Review Line */}
                                            <text x={boxX + tooltipWidth - 12} y={boxY + 62} textAnchor="end" fill="#38BDF8" style={{ fontSize: '10.5px', fontWeight: '600' }}>
                                                مراجعة: {hoveredPoint.cumReview.toFixed(1)} ص (+{formatInc(hoveredPoint.review)})
                                            </text>


                                        </g>
                                    );
                                })()}
                            </svg>
                        )}
                    </div>
                </div>
            );
        };


        // ==========================================
        // PROGRESS BAR METRICS & COLOR CODING (RED -> ORANGE -> GREEN)
        // ==========================================
        const getProgressHue = (percent) => {
            const clamped = Math.min(100, Math.max(0, Number(percent) || 0));
            // 21 steps (0%, 5%, 10%, ..., 100%), each 5% step has a distinct hue from red (0) to green (130)
            const step = Math.min(20, Math.floor(clamped / 5));
            return Math.round(step * 6.5);
        };

        const getProgressColor = (percent) => {
            const hue = getProgressHue(percent);
            // Slight lightness adjustment for yellows (hue 45-65) to preserve strong contrast
            const lightness = (hue >= 45 && hue <= 65) ? '38%' : '44%';
            return `hsl(${hue}, 85%, ${lightness})`;
        };

        const getGradeValueForFactor = (grade) => {
            if (!grade) return 0.75; // Default is جيد جدا (0.75) if no data
            const clean = String(grade).trim().replace('جدًا', 'جدا');
            if (clean === 'ممتاز') return 1.0;
            if (clean === 'جيد جدا') return 0.75;
            if (clean === 'جيد') return 0.5;
            if (clean === 'مقبول') return 0.25;
            return 0.75; // Default is جيد جدا (0.75)
        };

        // Students who completed the entire Quran (خاتمين للقرآن الكريم)
        const QURAN_COMPLETERS = [
            "يامن فادي العطرة",
            "يحيى خالد الشدفان",
            "يحيى الشدفان",
            "محمود الأطرش",
            "عبدالله الشهبان",
            "عمار عميرة",
            "يوسف خالد الشدفان"
        ];

        const isQuranCompleter = (studentName) => {
            if (!studentName) return false;
            const clean = String(studentName).trim().replace(/\s+/g, ' ');
            return QURAN_COMPLETERS.some(name => {
                const targetClean = name.trim().replace(/\s+/g, ' ');
                return clean === targetClean || (clean.includes("يحيى") && clean.includes("الشدفان"));
            });
        };

        // ==========================================
        // POINT SYSTEM (نظام النقاط والتنافس التراكمي)
        // ==========================================
        const isStudentCompleter = (student) => {
            if (!student) return false;
            if (student.isCompleter) return true;
            return isQuranCompleter(student.name);
        };

        const getMarkazAttendedDates = (students = []) => {
            const dates = new Set();
            students.forEach(student => {
                (student.history || []).forEach(session => {
                    const status = (session?.attendance?.status || '')
                        .normalize('NFKC')
                        .replace(/[ً-ٰٟ]/g, '')
                        .replace(/\s+/g, ' ')
                        .trim();
                    if (status.includes('حضر') || (session?.attendance?.present && !status.includes('لم يحضر') && !status.includes('غاب') && !status.includes('غياب'))) {
                        if (session.date) dates.add(session.date);
                    }
                });
            });
            return dates;
        };

        const getSessionAttendancePoints = (session, markazDatesSet) => {
            if (!session || !session.attendance) return 0;
            const status = (session.attendance.status || '')
                .normalize('NFKC')
                .replace(/[ً-ٰٟ]/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            // Attended variants (+10)
            if (status === 'حضر' || status === 'حضر متأخرا' || status === 'حضر وغادر' || (session.attendance.present && !status.includes('لم يحضر') && !status.includes('غاب') && !status.includes('غياب'))) {
                return 10;
            }

            // Absent with excuse (0)
            if (status.includes('بعذر') && !status.includes('بدون عذر')) {
                return 0;
            }

            // Absent without excuse (-10)
            if (status.includes('بدون عذر') || status.includes('لم يحضر') || status.includes('غاب') || status.includes('غياب')) {
                // If this day was NOT an active markaz day (holiday), no penalty
                if (session.date && markazDatesSet && !markazDatesSet.has(session.date)) {
                    return 0;
                }
                return -10;
            }

            return 0;
        };

        const getSessionJadidPoints = (session) => {
            if (!session || !session.new) return 0;
            const cleanGrade = (session.new.grade || '')
                .trim()
                .replace('جدًا', 'جدا');

            let jadidRate = 0;
            if (!cleanGrade) jadidRate = 15; // Assume جيد جدا (15 points/page) if no grade is specified
            else if (cleanGrade === 'ممتاز') jadidRate = 20;
            else if (cleanGrade === 'جيد جدا') jadidRate = 15;
            else if (cleanGrade === 'جيد') jadidRate = 5;
            else return 0;

            const pages = Math.floor(getNumericPages(session.new) || 0);
            return pages > 0 ? pages * jadidRate : 0;
        };

        const getSessionMurajaahPoints = (session, isCompleter = false) => {
            if (!session || !session.review) return 0;
            const pages = Math.floor(getNumericPages(session.review) || 0);
            if (pages <= 0) return 0;
            const rate = isCompleter ? 3 : 5;
            return pages * rate;
        };

        const evaluateSingleTestPoints = (test) => {
            if (!test) return 0;
            let ajzaa = 1;
            if (Number.isFinite(Number(test.juzCount)) && Number(test.juzCount) > 0) {
                ajzaa = Number(test.juzCount);
            }

            let gradeText = (test.grade || '').trim().replace('جدًا', 'جدا');
            let numericScore = null;
            if (Number.isFinite(Number(test.score))) {
                numericScore = Number(test.score);
            } else if (test.raw && !isNaN(parseFloat(test.raw)) && String(test.raw).includes('%')) {
                numericScore = parseFloat(test.raw);
            } else if (test.raw && !isNaN(parseFloat(test.raw)) && parseFloat(test.raw) > 50) {
                numericScore = parseFloat(test.raw);
            }

            if (numericScore !== null) {
                if (numericScore >= 95) return 50 * ajzaa;
                if (numericScore >= 90) return 30 * ajzaa;
                return 0;
            }

            if (gradeText === 'ممتاز') return 50 * ajzaa;
            if (gradeText === 'جيد جدا') return 30 * ajzaa;
            return 0;
        };

        const getSessionTestPoints = (session) => {
            if (!session) return 0;
            let total = 0;
            if (session.test) {
                if (Array.isArray(session.test)) {
                    session.test.forEach(t => { total += evaluateSingleTestPoints(t); });
                } else {
                    total += evaluateSingleTestPoints(session.test);
                }
            }
            if (Array.isArray(session.tests)) {
                session.tests.forEach(t => { total += evaluateSingleTestPoints(t); });
            }
            return total;
        };

        const calculateStudentAllTimePoints = (student, markazDatesSet) => {
            const isCompleter = isStudentCompleter(student);
            let jadidPoints = 0;
            let reviewPoints = 0;
            let testPoints = 0;
            let attendancePoints = 0;

            (student.history || []).forEach(session => {
                attendancePoints += getSessionAttendancePoints(session, markazDatesSet);
                jadidPoints += getSessionJadidPoints(session);
                reviewPoints += getSessionMurajaahPoints(session, isCompleter);
                testPoints += getSessionTestPoints(session);
            });

            const totalPoints = jadidPoints + reviewPoints + testPoints + attendancePoints;

            return {
                totalPoints,
                jadidPoints,
                reviewPoints,
                testPoints,
                attendancePoints,
                isCompleter
            };
        };

        const calculateStudentProgressMetrics = ({
            studentName = '',
            filteredEntries = [],
            splitStats = {},
            targetPages = 0,
            totalNewPagesInRange = 0,
            totalReviewPagesInRange = 0,
            expectedSessionsCount = 0
        }) => {
            const isCompleter = isQuranCompleter(studentName);

            // 1. New Memorization (Jadid) Progress Bar:
            // For Quran completers: jadid goal is 0
            const jadidTarget = isCompleter ? 0 : targetPages;
            const jadidProgress = jadidTarget > 0 
                ? Math.min(100, Math.round((totalNewPagesInRange / jadidTarget) * 100))
                : 0;

            // 2. Review (Murajaah) Progress Bar:
            // For Quran completers: 20 pages per session (40 per week)
            // For standard students: twice as jadid
            const reviewTarget = isCompleter 
                ? (expectedSessionsCount * 20)
                : (targetPages * 2);

            const reviewProgress = reviewTarget > 0 
                ? Math.min(100, Math.round((totalReviewPagesInRange / reviewTarget) * 100))
                : (totalReviewPagesInRange > 0 ? 100 : 0);

            // 3. Grade Factor:
            let totalJadidPagesRecited = 0;
            let weightedGradeSum = 0;

            filteredEntries.forEach(({ session, idx }) => {
                const pages = splitStats[idx]?.jadidPages || 0;
                if (pages > 0) {
                    const gradeVal = getGradeValueForFactor(session?.new?.grade);
                    weightedGradeSum += pages * gradeVal;
                    totalJadidPagesRecited += pages;
                }
            });

            // When there is no data, default grade factor is جيد جدا (0.75)
            const gradeFactor = totalJadidPagesRecited > 0 
                ? (weightedGradeSum / totalJadidPagesRecited) 
                : 0.75;

            // 3rd Bar: take the 1st prog bar, multiply by grade factor, add 2nd prog bar, divide by 2
            const compositeProgress = isCompleter
                ? reviewProgress
                : Math.min(
                    100, 
                    Math.max(0, Math.round(((jadidProgress * gradeFactor) + reviewProgress) / 2))
                );

            return {
                isCompleter,
                jadidTarget,
                jadidProgress,
                reviewTarget,
                reviewProgress,
                gradeFactor,
                compositeProgress
            };
        };

        const MultiProgressBar = ({
            isCompleter = false,
            jadidProgress,
            reviewProgress,
            compositeProgress,
            gradeFactor = 0.75,
            showLabels = true,
            className = ""
        }) => {
            // For students who finished the entire Quran:
            // "remove the first progress and last bar for them" -> Only the review progress bar is rendered
            if (isCompleter) {
                return (
                    <div className={`flex items-center gap-1 text-[9px] w-full min-w-0 ${className}`}>
                        {showLabels && (
                            <span className="text-slate-500 font-bold shrink-0 text-[8.5px]" title="خاتم للقرآن الكريم (هدف المراجعة: 20 ص/جلسة)">
                                مراجعة
                            </span>
                        )}
                        <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div 
                                className="h-full rounded-full transition-all duration-300"
                                style={{ 
                                    width: `${Math.min(100, Math.max(0, reviewProgress))}%`,
                                    backgroundColor: getProgressColor(reviewProgress)
                                }}
                            />
                        </div>
                        <span 
                            className="font-mono font-black text-[9px] shrink-0"
                            style={{ color: getProgressColor(reviewProgress) }}
                        >
                            {reviewProgress}%
                        </span>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col gap-1 w-full min-w-0 ${className}`}>
                    {/* Bar 1: جديد */}
                    <div className="flex items-center gap-1.5 text-[8px]">
                        {showLabels && <span className="text-slate-400 font-bold shrink-0 whitespace-nowrap">جديد</span>}
                        <div className="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
                            <div 
                                className="h-full rounded-full transition-all duration-300"
                                style={{ 
                                    width: `${Math.min(100, Math.max(0, jadidProgress))}%`,
                                    backgroundColor: getProgressColor(jadidProgress)
                                }}
                            />
                        </div>
                        <span 
                            className="font-mono font-black text-[8px] shrink-0 whitespace-nowrap"
                            style={{ color: getProgressColor(jadidProgress) }}
                        >
                            {jadidProgress}%
                        </span>
                    </div>

                    {/* Bar 2: مراجعة */}
                    <div className="flex items-center gap-1.5 text-[8px]">
                        {showLabels && <span className="text-slate-400 font-bold shrink-0 whitespace-nowrap">مراجعة</span>}
                        <div className="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
                            <div 
                                className="h-full rounded-full transition-all duration-300"
                                style={{ 
                                    width: `${Math.min(100, Math.max(0, reviewProgress))}%`,
                                    backgroundColor: getProgressColor(reviewProgress)
                                }}
                            />
                        </div>
                        <span 
                            className="font-mono font-black text-[8px] shrink-0 whitespace-nowrap"
                            style={{ color: getProgressColor(reviewProgress) }}
                        >
                            {reviewProgress}%
                        </span>
                    </div>

                    {/* Bar 3: الكلي */}
                    <div className="flex items-center gap-1.5 text-[8px] pt-0.5 border-t border-slate-100">
                        {showLabels && (
                            <span 
                                className="text-slate-600 font-black shrink-0 whitespace-nowrap"
                                title={`معامل درجات الجديد: ${gradeFactor.toFixed(2)}`}
                            >
                                الكلي
                            </span>
                        )}
                        <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div 
                                className="h-full rounded-full transition-all duration-300"
                                style={{ 
                                    width: `${Math.min(100, Math.max(0, compositeProgress))}%`,
                                    backgroundColor: getProgressColor(compositeProgress)
                                }}
                            />
                        </div>
                        <span 
                            className="font-mono font-black text-[8px] shrink-0 whitespace-nowrap"
                            style={{ color: getProgressColor(compositeProgress) }}
                        >
                            {compositeProgress}%
                        </span>
                    </div>
                </div>
            );
        };



        // ==========================================
        // EXPORT REPORTS & PDF MODAL COMPONENT
        // ==========================================
        const ExportReportsModal = ({
            isOpen,
            onClose,
            allStudents = [],
            processedStudents = [],
            dynamicGroupsList = [],
            allAvailableDates = [],
            initialStartDate = '',
            initialEndDate = '',
            triggerNotification = () => {}
        }) => {
            if (!isOpen) return null;

            // Scope & Target selection
            const [exportScope, setExportScope] = useState('current'); // 'current' | 'group' | 'single' | 'custom'
            const [selectedGroup, setSelectedGroup] = useState('all');
            const [selectedStudentId, setSelectedStudentId] = useState(allStudents[0]?.id || '');
            const [selectedStudentIds, setSelectedStudentIds] = useState(() => allStudents.map(s => s.id));
            const [studentSearch, setStudentSearch] = useState('');

            // Layout & Format
            const [layout, setLayout] = useState('summary'); // 'summary' | 'cards' | 'detailed'
            const [startDate, setStartDate] = useState(initialStartDate);
            const [endDate, setEndDate] = useState(initialEndDate);
            const [title, setTitle] = useState('تقرير متابعة الحفظ والتسميع');
            const [subtitle, setSubtitle] = useState('منظومة الحفاظ - مركز الفرقان لتعليم القرآن الكريم');
            const [orientation, setOrientation] = useState('portrait'); // 'portrait' | 'landscape'

            // Columns & Stats to show
            const [showJadid, setShowJadid] = useState(true);
            const [showReview, setShowReview] = useState(true);
            const [showPoints, setShowPoints] = useState(true);
            const [showSard, setShowSard] = useState(false);
            const [showProgressBars, setShowProgressBars] = useState(true);
            const [showGrades, setShowGrades] = useState(true);
            const [showAttendance, setShowAttendance] = useState(true);
            const [showNotes, setShowNotes] = useState(true);
            const [showSummaryCards, setShowSummaryCards] = useState(true);
            const [showSignatures, setShowSignatures] = useState(true);
            const [separatePages, setSeparatePages] = useState(false); // Only page break per student in detailed if explicitly enabled

            // Preview mode toggle
            const [previewMode, setPreviewMode] = useState(false);

            // Resolve target students
            const targetStudents = useMemo(() => {
                if (exportScope === 'current') return processedStudents;
                if (exportScope === 'group') {
                    if (selectedGroup === 'all') return allStudents;
                    return allStudents.filter(s => (s.group || s.level) === selectedGroup);
                }
                if (exportScope === 'single') {
                    const found = allStudents.find(s => String(s.id) === String(selectedStudentId));
                    return found ? [found] : (allStudents.length > 0 ? [allStudents[0]] : []);
                }
                if (exportScope === 'custom') {
                    const idSet = new Set(selectedStudentIds.map(String));
                    return allStudents.filter(s => idSet.has(String(s.id)));
                }
                return processedStudents;
            }, [exportScope, selectedGroup, selectedStudentId, selectedStudentIds, processedStudents, allStudents]);

            // Filtered students for custom bulk selection search
            const filteredSearchStudents = useMemo(() => {
                if (!studentSearch.trim()) return allStudents;
                const q = studentSearch.trim().toLowerCase();
                return allStudents.filter(s => 
                    s.name.toLowerCase().includes(q) || 
                    (s.group || s.level || '').toLowerCase().includes(q)
                );
            }, [allStudents, studentSearch]);

            const toggleSelectAll = (select) => {
                if (select) {
                    setSelectedStudentIds(allStudents.map(s => s.id));
                } else {
                    setSelectedStudentIds([]);
                }
            };

            const toggleStudentId = (id) => {
                setSelectedStudentIds(prev => 
                    prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
                );
            };

            // Date filtering helper
            const isReportDateInRange = (dateStr) => {
                if (!dateStr) return false;
                if (startDate && dateStr < startDate) return false;
                if (endDate && dateStr > endDate) return false;
                return true;
            };

            // Calculate available session dates for expected days and targets
            const availableDates = useMemo(() => {
                if (allAvailableDates && allAvailableDates.length > 0) return allAvailableDates;
                const dates = new Set();
                allStudents.forEach(student => {
                    (student.history || []).forEach(session => {
                        if (session && session.date) dates.add(session.date);
                    });
                });
                return Array.from(dates).sort();
            }, [allAvailableDates, allStudents]);

            const calculateExpectedDaysForGroup = (groupName, start, end) => {
                return availableDates.filter(date => (!start || date >= start) && (!end || date <= end)).length;
            };

            const calculateTargetPages = (groupName, start, end, studentName = '') => {
                if (isQuranCompleter(studentName)) {
                    return 0;
                }
                let targetSum = 0;
                availableDates.forEach((dateStr) => {
                    if ((start && dateStr < start) || (end && dateStr > end)) return;
                    targetSum += 2;
                });
                return targetSum;
            };

            const markazAttendedDatesSet = useMemo(() => {
                return getMarkazAttendedDates(allStudents || []);
            }, [allStudents]);

            // Compute data for each student
            const processedExportData = useMemo(() => {
                return targetStudents.map(student => {
                    const studentHistory = student.history || [];
                    const studentHistoryWithIndex = studentHistory.map((session, idx) => ({ session, idx }));
                    const splitStats = getSessionSplitStatsByIndex(studentHistory);
                    const filteredEntries = studentHistoryWithIndex.filter(({ session }) => isReportDateInRange(session.date));
                    const filteredHistory = filteredEntries.map(({ session }) => session);
                    const sardEntries = filteredEntries.filter(({ idx }) => (splitStats[idx]?.sardPages || 0) > 0);

                    const totalNewPages = calculateTotalNewPagesInRange(filteredEntries, splitStats);
                    const totalReviewPages = filteredHistory.reduce((acc, curr) => acc + getNumericPages(curr.review), 0);
                    const totalSardPages = calculateTotalSardPagesInRange(sardEntries, splitStats);

                    const mergedJadidSet = new Set();
                    filteredEntries.forEach(({ idx }) => {
                        const pSet = splitStats[idx]?.jadidPageSet || getPageSetFromRaw(splitStats[idx]?.jadidRaw);
                        if (pSet) pSet.forEach(p => mergedJadidSet.add(p));
                    });
                    const currentNewRaw = formatPageSet(mergedJadidSet);

                    const reviewSessions = filteredHistory.filter(session => getNumericPages(session.review) > 0);
                    const currentReviewRaw = summarizeRaw(reviewSessions, 'review');

                    const mergedSardSet = new Set();
                    sardEntries.forEach(({ idx }) => {
                        const pSet = splitStats[idx]?.sardPageSet || getPageSetFromRaw(splitStats[idx]?.sardRaw);
                        if (pSet) pSet.forEach(p => mergedSardSet.add(p));
                    });
                    const currentSardNewRaw = formatPageSet(mergedSardSet);

                    const jadidSessions = filteredEntries
                        .filter(({ idx }) => (splitStats[idx]?.jadidPages || 0) > 0)
                        .map(({ session }) => session);
                    const currentNewGrade = calculateMeanGrade(jadidSessions, 'new');
                    const currentReviewGrade = calculateMeanGrade(reviewSessions, 'review');

                    const attendedDays = filteredHistory.filter(session => isAttendancePresent(session.attendance)).length;

                    const studentGroup = student.group || student.level || '---';
                    const expectedDays = calculateExpectedDaysForGroup(studentGroup, startDate, endDate);
                    const targetPages = calculateTargetPages(studentGroup, startDate, endDate, student.name);
                    const metrics = calculateStudentProgressMetrics({
                        studentName: student.name,
                        filteredEntries,
                        splitStats,
                        targetPages,
                        totalNewPagesInRange: totalNewPages,
                        totalReviewPagesInRange: totalReviewPages,
                        expectedSessionsCount: expectedDays
                    });

                    const points = calculateStudentAllTimePoints(student, markazAttendedDatesSet);

                    return {
                        student,
                        studentGroup,
                        expectedDays,
                        targetPages,
                        filteredEntries,
                        splitStats,
                        totalNewPages,
                        totalReviewPages,
                        totalSardPages,
                        currentNewRaw,
                        currentReviewRaw,
                        currentSardNewRaw,
                        currentNewGrade,
                        currentReviewGrade,
                        attendedDays,
                        metrics,
                        points
                    };
                });
            }, [targetStudents, startDate, endDate, markazAttendedDatesSet]);

            // Summary metrics for KPI header
            const summaryTotals = useMemo(() => {
                let sumNew = 0;
                let sumReview = 0;
                let sumRate = 0;
                let sumPoints = 0;
                processedExportData.forEach(item => {
                    sumNew += item.totalNewPages;
                    sumReview += item.totalReviewPages;
                    sumPoints += (item.points?.totalPoints || 0);
                    const r = item.metrics.isCompleter ? item.metrics.reviewProgress : item.metrics.compositeProgress;
                    sumRate += r;
                });
                return {
                    count: processedExportData.length,
                    totalNew: sumNew,
                    totalReview: sumReview,
                    totalPoints: sumPoints,
                    avgRate: processedExportData.length > 0 ? Math.round(sumRate / processedExportData.length) : 0
                };
            }, [processedExportData]);

            // Print action
            const handlePrint = () => {
                let styleTag = document.getElementById('export-print-page-style');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'export-print-page-style';
                    document.head.appendChild(styleTag);
                }
                styleTag.innerHTML = `@page { size: A4 ${orientation}; margin: 6mm; }`;
                triggerNotification('جاري فتح نافذة الطباعة / الحفظ كـ PDF...', 'info');
                setTimeout(() => {
                    window.print();
                }, 150);
            };

            // Report Header JSX
            const renderReportHeader = () => (
                <div className="border-b-2 border-slate-800 pb-4 mb-4">
                    <div className="flex justify-between items-start gap-4">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-slate-900 text-white rounded-2xl print:bg-slate-900 print:text-white">
                                <BookOpen size={24} />
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-slate-900">{title}</h1>
                                <p className="text-xs font-bold text-slate-600 mt-0.5">{subtitle}</p>
                            </div>
                        </div>
                        <div className="text-left text-xs font-bold text-slate-700 space-y-1" dir="rtl">
                            <div>
                                <span className="text-slate-400">النطاق: </span>
                                <span className="text-slate-900 font-black">
                                    {exportScope === 'current' 
                                        ? 'الطلاب الظاهرون' 
                                        : exportScope === 'group' 
                                            ? (selectedGroup === 'all' ? 'جميع الحلقات' : `حلقة ${selectedGroup}`) 
                                            : exportScope === 'single' 
                                                ? 'تقرير فردي' 
                                                : 'تحديد مخصص'}
                                </span>
                            </div>
                            <div>
                                <span className="text-slate-400">العدد: </span>
                                <span className="text-indigo-700 font-mono font-black">{processedExportData.length}</span>
                                <span className="text-slate-600 font-bold"> طالب</span>
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 pt-3 border-t border-slate-200 flex flex-wrap justify-between items-center text-xs font-bold text-slate-700 gap-2">
                        <div className="flex items-center gap-2">

                                                        <button
                                                            type="button"
                                                            onClick={() => setOrientation('portrait')}
                                                            className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all ${
                                                                orientation === 'portrait' ? 'bg-white border-indigo-500 text-indigo-700 shadow-sm' : 'bg-white/60 border-slate-200 text-slate-600'

                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setOrientation('landscape')}
                                                            className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all ${
                                                                orientation === 'landscape' ? 'bg-white border-indigo-500 text-indigo-700 shadow-sm' : 'bg-white/60 border-slate-200 text-slate-600'
                                                            }`}
