                                                </div>

                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-500">اسم المركز / المؤسسة:</label>
                                                    <input 
                                                        type="text" 
                                                        value={subtitle} 
                                                        onChange={(e) => setSubtitle(e.target.value)} 
                                                        className="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-100"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                )}
                            </div>

                            {/* Modal Footer */}
                            <div className="p-5 sm:p-6 bg-slate-50 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3 shrink-0">
                                <div className="text-xs font-bold text-slate-500">
                                    المشمول في التقرير: <span className="font-mono text-indigo-700 font-black">{processedExportData.length}</span> طالب
                                </div>

                                <div className="flex items-center gap-2">
                                    <button 
                                        type="button"
                                        onClick={() => setPreviewMode(!previewMode)}
                                        className="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition-all"
                                    >
                                        {previewMode ? 'العودة لتعديل الخيارات' : 'معاينة شكل التقرير'}
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={handlePrint}
                                        className="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl text-xs font-black shadow-lg shadow-indigo-200 transition-all"
                                    >
                                        <Printer size={16} />
                                        <span>طباعة وحفظ كـ PDF</span>
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={onClose}
                                        className="px-4 py-2.5 text-slate-500 hover:text-slate-800 rounded-xl text-xs font-bold transition-all"
                                    >
                                        إغلاق
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </>
            );
        };


        // ==========================================
        // MAIN REACT APPLICATION COMPONENT
        // ==========================================
        function App() {
            // Authentication & Session States
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUserRole, setCurrentUserRole] = useState(null); // 'admin' | 'student'
            const [loggedInStudent, setLoggedInStudent] = useState(null); // Student details object if role is student
            const [studentLoginInput, setStudentLoginInput] = useState('');
            const [studentLoginError, setStudentLoginError] = useState('');

            // Core States
            const [data, setData] = useState(initialData);
            const [jsonText, setJsonText] = useState(JSON.stringify(initialData, null, 2));
            const [jsonError, setJsonError] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [hasReceivedInitialJson, setHasReceivedInitialJson] = useState(false);
            const [showTroubleshooting, setShowTroubleshooting] = useState(false);
            const [fetchErrorDetail, setFetchErrorDetail] = useState('');
            
            // Custom Confirmation modal overlays
            const [customConfirm, setCustomConfirm] = useState(null); // { message, onConfirm }

            // App View & Filters
            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'editor'
            const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'list'
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedLevel, setSelectedLevel] = useState('all');
            const [sortBy, setSortBy] = useState('name-asc'); // Sorting orders
            const [selectedStudent, setSelectedStudent] = useState(null); // Detail modal student
            const [showAddSessionModal, setShowAddSessionModal] = useState(false);
            const [showAddStudentModal, setShowAddStudentModal] = useState(false);
            const [notification, setNotification] = useState(null);
            const [showExportModal, setShowExportModal] = useState(false);

            // Inclusive Date Ranges (Default sets)
            const [startDate, setStartDate] = useState('2026-06-29');
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);

            // Form bindings (Adding sessions)
            const [formStudentId, setFormStudentId] = useState('');
            const [formDate, setFormDate] = useState('2026-07-02');
            const [formNewRaw, setFormNewRaw] = useState('');
            const [formNewPages, setFormNewPages] = useState('');
            const [formNewGrade, setFormNewGrade] = useState('ممتاز');
            const [formReviewRaw, setFormReviewRaw] = useState('');
            const [formReviewPages, setFormReviewPages] = useState('');
            const [formReviewGrade, setFormReviewGrade] = useState('ممتاز');

            // Form bindings (Adding students)
            const [newStudentName, setNewStudentName] = useState('');
            const [newStudentGroup, setNewStudentGroup] = useState('صغرى');

            // API Cloud Fetch Sync with Robust Double-parsing
            const loadLiveData = () => {
                setIsLoading(true);
                setFetchErrorDetail('');
                
                fetch('https://script.google.com/macros/s/AKfycbzmG715vEE01EX_H6B84U6n542MS08hYH9A_Ze18zt6eJgApsx9HXhtqvRfFKv8obIf/exec')
                    .then(response => {
                        if (!response.ok) throw new Error(`خطأ بالطلب البرمجي: ${response.status}`);
                        return response.text();
                    })
                    .then(rawText => {
                        let parsedPayload;
                        try {
                            parsedPayload = JSON.parse(rawText);
                            if (typeof parsedPayload === 'string') {
                                parsedPayload = JSON.parse(parsedPayload);
                            }
                        } catch (e) {
                            throw new Error('فشل فك صياغة كود الـ JSON المستلم.');
                        }

                        if (parsedPayload && parsedPayload.students) {
                            console.log('🔄 Live data fetched from API:', parsedPayload);
                            updateMainData(parsedPayload);
                            setHasReceivedInitialJson(true);
                            triggerNotification('تم تحديث البيانات المباشرة بنجاح!', 'success');
                            setFetchErrorDetail('');
                        } else {
                            throw new Error('صيغة كائن الـ JSON غير متوافقة.');
                        }
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        setFetchErrorDetail(error.message || 'CORS blocker or network issue');
                        triggerNotification('تعذر جلب البيانات المباشرة. يتم عرض التطبيق بدون بيانات محملة.', 'amber');
                    })
                    .finally(() => {
                        setIsLoading(false);
                    });
            };



            // Pull latest cloud changes automatically on bootstrap
            useEffect(() => {
                loadLiveData();
            }, []);

            // Log data object to console on every load/refresh
            useEffect(() => {
                console.log('📊 JSON Data Object Updated:', data);
            }, [data]);

            // Display floating notifications
            const triggerNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => {
                    setNotification(null);
                }, 5000);
            };

            // Sync structural state changes
            const updateMainData = (newData) => {
                setData(newData);
                setJsonText(JSON.stringify(newData, null, 2));
                setJsonError(null);
            };

            // Dynamic live JSON validator
            const handleJsonTextChange = (text) => {
                setJsonText(text);
                try {
                    const parsed = JSON.parse(text);
                    if (parsed && typeof parsed === 'object') {
                        setData(parsed);
                        setJsonError(null);
                    } else {
                        setJsonError('يجب أن يكون المدخل كائن JSON صالح.');
                    }
                } catch (e) {
                    setJsonError(`خطأ في صياغة JSON: ${e.message}`);
                }
            };

            // Reset back to system baseline fallback
            const resetToDefault = () => {
                setCustomConfirm({
                    message: 'هل أنت متأكد من رغبتك في إعادة تعيين البيانات الحالية إلى البيانات الافتراضية؟ سيفقد أي تقدم غير محفوظ بالسحابة.',
                    onConfirm: () => {
                        updateMainData(initialData);
                        setStartDate('2026-06-29');
                        setEndDate(new Date().toISOString().split('T')[0]);
                        setSelectedLevel('all');
                        setShowTroubleshooting(false);
                        triggerNotification('تمت إعادة تعيين البيانات بنجاح', 'info');
                    }
                });
            };

            // Extract all unique dates from JSON array payload (or fallback to OFFICIAL_RECITATION_DATES)
            const allAvailableDates = useMemo(() => {
                if (!data || !data.students) return OFFICIAL_RECITATION_DATES;
                const dateSet = new Set();
                data.students.forEach(student => {
                    if (Array.isArray(student.history)) {
                        student.history.forEach(session => {
                            if (session && session.date) {
                                dateSet.add(session.date);
                            }
                        });
                    }
                });
                if (dateSet.size === 0) return OFFICIAL_RECITATION_DATES;
                return Array.from(dateSet).sort();
            }, [data]);

            // First date in the JSON array
            const firstDateInJson = useMemo(() => {
                return allAvailableDates.length > 0 ? allAvailableDates[0] : '2026-06-29';
            }, [allAvailableDates]);

            // Set start date to the first date in the JSON array automatically when data updates
            useEffect(() => {
                if (firstDateInJson) {
                    setStartDate(firstDateInJson);
                }
            }, [firstDateInJson]);

            // Inclusive range filter checker
            const isDateInRange = (dateStr) => {
                if (!dateStr) return false;
                return dateStr >= startDate && dateStr <= endDate;
            };

            const expectedDaysInRange = useMemo(() => {
                return allAvailableDates.filter(date => date >= startDate && date <= endDate).length;
            }, [allAvailableDates, startDate, endDate]);

            // Calculate expected days to be attended from the JSON array dates
            const calculateExpectedDaysForGroup = (groupName, start, end) => {
                return allAvailableDates.filter(date => date >= start && date <= end).length;
            };

            // Calculate student target expectation pages (2 new pages per day, or 0 for Quran completers)
            const calculateTargetPages = (groupName, start, end, studentName = '') => {
                if (isQuranCompleter(studentName)) {
                    return 0;
                }
                let targetSum = 0;
                allAvailableDates.forEach((dateStr) => {
                    if (dateStr < start || dateStr > end) return;
                    targetSum += 2;
                });
                return targetSum;
            };

            // Unique categories extracter
            const dynamicGroupsList = useMemo(() => {
                if (!data.students) return [];
                const groups = data.students.map(s => s.group || s.level).filter(Boolean);
                return [...new Set(groups)].sort();
            }, [data.students]);

            // Active center attendance dates (dates where at least 1 student attended the Markaz)
            const markazAttendedDatesSet = useMemo(() => {
                return getMarkazAttendedDates(data.students || []);
            }, [data.students]);

            // All-time points calculated per student
            const allTimePointsByStudentId = useMemo(() => {
                const map = new Map();
                (data.students || []).forEach(student => {
                    map.set(student.id, calculateStudentAllTimePoints(student, markazAttendedDatesSet));
                });
                return map;
            }, [data.students, markazAttendedDatesSet]);

            const processedStudents = useMemo(() => {
                if (!data.students) return [];

                let list = [...data.students];

                if (searchQuery.trim() !== '') {
                    list = list.filter(student => 
                        student.name.toLowerCase().includes(searchQuery.toLowerCase())
                    );
                }

                if (selectedLevel !== 'all') {
                    list = list.filter(student => (student.group || student.level) === selectedLevel);
                }

                const progressMetricsByStudentId = (sortBy && sortBy.startsWith('progress-'))
                    ? new Map(
                        list.map(student => {
                            const studentHistory = student.history || [];
                            const studentHistoryWithIndex = studentHistory.map((session, idx) => ({ session, idx }));
                            const splitStats = getSessionSplitStatsByIndex(studentHistory);
                            const filteredEntries = studentHistoryWithIndex.filter(({ session }) => isDateInRange(session.date));
                            const filteredHistory = filteredEntries.map(({ session }) => session);

                            const totalNewPagesInRange = calculateTotalNewPagesInRange(filteredEntries, splitStats);
                            const totalReviewPagesInRange = filteredHistory.reduce((acc, curr) => acc + getNumericPages(curr.review), 0);

                            const studentGroup = student.group || student.level || '---';
                            const expectedDays = calculateExpectedDaysForGroup(studentGroup, startDate, endDate);
                            const targetPages = calculateTargetPages(studentGroup, startDate, endDate, student.name);

                            const metrics = calculateStudentProgressMetrics({
                                studentName: student.name,
                                filteredEntries,
                                splitStats,
                                targetPages,
                                totalNewPagesInRange,
                                totalReviewPagesInRange,
                                expectedSessionsCount: expectedDays
                            });

                            return [student.id, metrics];
                        })
                    )
                    : null;

                list.sort((a, b) => {
                    if (sortBy === 'name-asc') {
                        return a.name.localeCompare(b.name, 'ar');
                    }
                    if (sortBy === 'points-desc') {
                        const aPts = allTimePointsByStudentId?.get(a.id)?.totalPoints ?? 0;
                        const bPts = allTimePointsByStudentId?.get(b.id)?.totalPoints ?? 0;
                        const diff = bPts - aPts;
                        if (diff !== 0) return diff;
                        return a.name.localeCompare(b.name, 'ar');
                    }
                    if (sortBy === 'points-asc') {
                        const aPts = allTimePointsByStudentId?.get(a.id)?.totalPoints ?? 0;
                        const bPts = allTimePointsByStudentId?.get(b.id)?.totalPoints ?? 0;
                        const diff = aPts - bPts;
                        if (diff !== 0) return diff;
                        return a.name.localeCompare(b.name, 'ar');
                    }
                    if (sortBy === 'progress-composite-desc') {
                        const aMet = progressMetricsByStudentId?.get(a.id);
                        const bMet = progressMetricsByStudentId?.get(b.id);
                        const diff = (bMet?.compositeProgress || 0) - (aMet?.compositeProgress || 0);
                        if (diff !== 0) return diff;
                        return a.name.localeCompare(b.name, 'ar');
                    }
                    if (sortBy === 'progress-jadid-desc') {
                        const aMet = progressMetricsByStudentId?.get(a.id);
                        const bMet = progressMetricsByStudentId?.get(b.id);
                        const diff = (bMet?.jadidProgress || 0) - (aMet?.jadidProgress || 0);
                        if (diff !== 0) return diff;
                        return a.name.localeCompare(b.name, 'ar');
                    }
                    if (sortBy === 'progress-review-desc') {
                        const aMet = progressMetricsByStudentId?.get(a.id);
                        const bMet = progressMetricsByStudentId?.get(b.id);
                        const diff = (bMet?.reviewProgress || 0) - (aMet?.reviewProgress || 0);
                        if (diff !== 0) return diff;
                        return a.name.localeCompare(b.name, 'ar');
                    }
                    return 0;
                });

                return list;
            }, [data.students, searchQuery, selectedLevel, sortBy, startDate, endDate, expectedDaysInRange, allTimePointsByStudentId]);

            // Consolidated analytical KPI stats (Filtered)
            const overallMetrics = useMemo(() => {
                let totalNew = 0;
                let totalReview = 0;
                let sumAchievementRates = 0;
                
                processedStudents.forEach(student => {
                    const studentHistory = student.history || [];
                    const studentHistoryWithIndex = studentHistory.map((session, idx) => ({ session, idx }));
                    const splitStats = getSessionSplitStatsByIndex(studentHistory);
                    const filteredEntries = studentHistoryWithIndex.filter(({ session }) => isDateInRange(session.date));
                    const filteredHistory = filteredEntries.map(({ session }) => session);

                    const studentNewPages = calculateTotalNewPagesInRange(filteredEntries, splitStats);
                    const studentReviewPages = filteredHistory.reduce((acc, curr) => acc + getNumericPages(curr.review), 0);

                    totalNew += studentNewPages;
                    totalReview += studentReviewPages;

                    const studentGroup = student.group || student.level || '---';
                    const expectedDays = calculateExpectedDaysForGroup(studentGroup, startDate, endDate);
                    const targetPages = calculateTargetPages(studentGroup, startDate, endDate, student.name);

                    const metrics = calculateStudentProgressMetrics({
                        studentName: student.name,
                        filteredEntries,
                        splitStats,
                        targetPages,
                        totalNewPagesInRange: studentNewPages,
                        totalReviewPagesInRange: studentReviewPages,
                        expectedSessionsCount: expectedDays
                    });

                    // For خاتم: take the murajaah value; for others: take the 3rd progress bar value
                    const studentRate = metrics.isCompleter ? metrics.reviewProgress : metrics.compositeProgress;
                    sumAchievementRates += studentRate;
                });

                const averageRate = processedStudents.length > 0 
                    ? Math.round(sumAchievementRates / processedStudents.length) 
                    : 0;
                const boundedRate = Math.min(100, Math.max(0, averageRate));

                return {
                    totalNew: totalNew.toFixed(1),
                    totalReview: totalReview.toFixed(1),
                    achievementRate: boundedRate
                };
            }, [processedStudents, startDate, endDate]);

            // Role assigners
            const handleRoleLogin = (role) => {
                setCurrentUserRole(role);
                setIsLoggedIn(true);
                setStudentLoginError('');
                setStudentLoginInput('');

                setSelectedLevel('all');
                triggerNotification(`مرحباً بك! تم تسجيل الدخول كـ ${role === 'admin' ? 'الإدارة العامة' : 'طالب'}`, 'success');
            };

            // Intelligent student identity matcher
            const handleStudentNameLoginSubmit = (e) => {
                e.preventDefault();
                setStudentLoginError('');

                const query = studentLoginInput.trim().toLowerCase();
                if (!query) {
                    setStudentLoginError('الرجاء كتابة الاسم للتمكن من الدخول.');
                    return;
                }

                if (query === 'admin') {
                    handleRoleLogin('admin');
                    return;
                }

                const queryWords = query.split(/\s+/).filter(w => w.length > 0);

                if (queryWords.length === 1) {
                    const singleWord = queryWords[0];

                    const firstNameMatches = data.students.filter(student => {
                        const studentFirstName = student.name.trim().split(/\s+/)[0].toLowerCase();
                        return studentFirstName === singleWord;
                    });

                    if (firstNameMatches.length === 1) {
                        const matched = firstNameMatches[0];
                        setLoggedInStudent(matched);
                        setCurrentUserRole('student');
                        setIsLoggedIn(true);
                        setStudentLoginInput('');
                        setStudentLoginError('');
                        triggerNotification(`مرحباً بك يا ${matched.name} في بوابتك التعليمية 👋`, 'success');
                        return;
                    } else if (firstNameMatches.length > 1) {
                        setStudentLoginError('يوجد أكثر من طالب بهذا الاسم الأول. الرجاء كتابة اسمك الثنائي المعتمد في الحلقة للتمييز بين السجلات.');
                        return;
                    }

                    const fallbackMatches = data.students.filter(student => {
                        return student.name.toLowerCase().includes(singleWord);
                    });

                    if (fallbackMatches.length === 1) {
                        const matched = fallbackMatches[0];
                        setLoggedInStudent(matched);
                        setCurrentUserRole('student');
                        setIsLoggedIn(true);
                        setStudentLoginInput('');
                        setStudentLoginError('');
                        triggerNotification(`مرحباً بك يا ${matched.name} في بوابتك التعليمية 👋`, 'success');
                        return;
                    } else if (fallbackMatches.length > 1) {
                        setStudentLoginError('يوجد أكثر من اسم يطابق هذه الكلمة. الرجاء كتابة الاسم الثنائي بالكامل.');
                        return;
                    } else {
                        setStudentLoginError('لم نتمكن من العثور على اسم الطالب في الحلقة. يرجى التأكد من كتابة الاسم الصحيح بشكل صحيح.');
                        return;
                    }
                }

                const matched = data.students.find(student => {
                    const dbName = student.name.toLowerCase();
                    return queryWords.every(word => dbName.includes(word));
                });

                if (matched) {
                    setLoggedInStudent(matched);
                    setCurrentUserRole('student');
                    setIsLoggedIn(true);
                    setStudentLoginInput('');
                    setStudentLoginError('');
                    triggerNotification(`مرحباً بك يا ${matched.name} في بوابتك التعليمية 👋`, 'success');
                } else {
                    setStudentLoginError('لم نتمكن من العثور على اسم الطالب في الحلقة. يرجى مراجعة الصياغة والتأكد من الاسم الصحيح.');
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentUserRole(null);
                setLoggedInStudent(null);
                setSelectedStudent(null);
                triggerNotification('تم تسجيل الخروج بنجاح. نتمنى لك يوماً سعيداً!', 'info');
            };

            const handleAddSessionSubmit = (e) => {
                e.preventDefault();
                if (!formStudentId) {
                    alert('الرجاء اختيار الطالب أولاً');
                    return;
                }

                const updatedStudents = data.students.map(student => {
                    if (student.id === parseInt(formStudentId)) {
                        const newPageSet = getPageSetFromRaw(formNewRaw);
                        const newRange = getBoundsFromPageSet(newPageSet);
                        const reviewPageSet = getPageSetFromRaw(formReviewRaw);
                        const reviewRange = getBoundsFromPageSet(reviewPageSet);

                        const parsedNewPages = Number(formNewPages);
                        const parsedReviewPages = Number(formReviewPages);

                        const newSession = {
                            date: formDate,
                            new: formNewRaw ? {
                                type: "range",
                                raw: formNewRaw,
                                start: newRange?.start || 0,
                                end: newRange?.end || 0,
                                pages: Number.isFinite(parsedNewPages) && parsedNewPages > 0
                                    ? parsedNewPages
                                    : (newPageSet ? newPageSet.size : 1),
                                grade: formNewGrade || null,
                                sheetPages: Number.isFinite(parsedNewPages) && parsedNewPages > 0
                                    ? parsedNewPages
                                    : (newPageSet ? newPageSet.size : 1)
                            } : null,
                            review: formReviewRaw ? {
                                type: "range",
                                raw: formReviewRaw,
                                start: reviewRange?.start || 0,
                                end: reviewRange?.end || 0,
                                pages: Number.isFinite(parsedReviewPages) && parsedReviewPages > 0
                                    ? parsedReviewPages
                                    : (reviewPageSet ? reviewPageSet.size : 1),
                                grade: formReviewGrade || null,
                                sheetPages: Number.isFinite(parsedReviewPages) && parsedReviewPages > 0
                                    ? parsedReviewPages
                                    : (reviewPageSet ? reviewPageSet.size : 1)
                            } : null
                        };

                        const existingHistory = student.history ? [...student.history] : [];
                        return {
                            ...student,
                            history: [...existingHistory, newSession]
                        };
                    }
                    return student;
                });

                if (formDate > endDate) {
                    setEndDate(formDate);
                }

                updateMainData({
                    ...data,
                    students: updatedStudents
                });

                setFormNewRaw('');
                setFormNewPages('');
                setFormReviewRaw('');
                setFormReviewPages('');
                setShowAddSessionModal(false);
                triggerNotification('تمت إضافة الجلسة بنجاح!');
            };

            const handleAddStudentSubmit = (e) => {
                e.preventDefault();
                if (!newStudentName.trim()) {
                    alert('الرجاء إدخال اسم الطالب');
                    return;
                }

                const nextId = data.students && data.students.length > 0 
                    ? Math.max(...data.students.map(s => s.id)) + 1 
                    : 1;

                const newStudentObj = {
                    id: nextId,
                    name: newStudentName.trim(),
                    group: newStudentGroup,

                                    </button>

                                    <button 
                                        type="submit"
                                        className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-100 transition-all"
                                    >
                                        إضافة الطالب لقاعدة البيانات
                                    </button>
                                </div>

                            </form>
                        </div>
                    )}

                </div>
            );
        }

        // --- INJECTING APP DOM ROOT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
